<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loki WiFi</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f8f8f8}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #ddd;margin-bottom:20px}
input,button{padding:14px;width:95%;margin:8px 0;font-size:18px;border-radius:10px;border:1px solid #ccc}
button{background:black;color:white;font-weight:bold}
.admin-link{margin-top:40px;font-size:14px;color:#888;text-decoration:underline;cursor:pointer}
.hidden{display:none}
.voucher-item{background:#eee;padding:10px;margin:5px;border-radius:8px;font-size:14px}
</style>
</head>
<body>

<h2>Loki WiFi Login</h2>

<!-- USER AREA -->
<div class="card" id="userBox">
<h3>Enter Voucher</h3>
<input id="code" placeholder="e.g 4829">
<button onclick="login()">CONNECT</button>
<p id="status"></p>
</div>

<!-- ADMIN LOGIN LINK -->
<p class="<button onclick="showAdminLogin()" style="background:none;border:none;color:#0066ff;text-decoration:underline;font-size:14px;margin-top:40px">Administration Login</button>admin-link" onclick="showAdminLogin()">Administration Login</p>

<!-- ADMIN LOGIN FORM -->
<div class="card shown" id="adminLoginBox">
<h3>Admin Login</h3>
<input id="adminPass" type="password" placeholder="Admin Password">
<button onclick="checkAdmin()">LOGIN</button>
<p id="adminLoginStatus"></p>
</div>

<!-- ADMIN PANEL - HIDDEN UNTIL LOGIN -->
<div class="card hidden" id="adminBox">
<h3>Admin Panel</h3>
<p>Generate Vouchers</p>
<button onclick="generate(60)">Generate 1 Hour</button>
<button onclick="generate(180)">Generate 3 Hours</button>
<button onclick="generate(1440)">Generate 24 Hours</button>
<p id="newVoucher"></p>
<h4>Active Vouchers</h4>
<div id="list"></div>
<button style
