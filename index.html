<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starlink Voucher</title>
<style>body{font-family:Arial;text-align:center;padding:20px}input,button{padding:14px;width:95%;margin:8px;font-size:18px;border-radius:10px}button{background:black;color:white}.card{border:1px solid #ddd;padding:20px;border-radius:15px;margin-top:15px}</style>
</head>
<body>
<h2>Starlink WiFi Login</h2>
<div class="card">
<input id="code" placeholder="Enter Voucher">
<button onclick="login()">CONNECT</button>
<p id="status"></p>
</div>
<div class="card" style="background:#">
<h3>ADMIN</h3>
<button onclick="generate()">Generate 1 Hour Token</button>
<p id="voucher"></p>
</div>
<script>
function generate(){
 let c=Math.floor(1000+Math.random()*9000);
 let expiry=Date.now()+3600000;
 localStorage.setItem("V_"+c,expiry);
 document.getElementById("voucher").innerHTML="NEW CODE: <b>"+c+"</b> (1h)";
}
function login(){
 let c=document.getElementById("code").value;
 let e=localStorage.getItem("V_"+c);
 if(!e){document.getElementById("status").innerText="❌ Invalid";return;}
 if(Date.now()>e){document.getElementById("status").innerText="❌ Expired";return;}
 let left=Math.round((e-Date.now())/60000);
 document.getElementById("status").innerText="✅ Connected! "+left+" min left";
}
</script>
</body>
</html>
